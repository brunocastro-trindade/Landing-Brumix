    <!--
      Google tag (gtag.js) + Microsoft Clarity — loaded on the visitor's
      first real interaction (scroll/click/touch/keypress), with a 8s
      fallback so a visitor who just reads without interacting is still
      tracked. This keeps their ~1.2s combined script-evaluation cost off
      the initial render entirely instead of merely delaying it to `load`.
      Trade-off: a visitor who leaves within ~8s without scrolling or
      clicking anything won't be tracked — a real cost for a landing page
      whose whole job is to get a click, so revisit this if bounce-heavy
      traffic ends up under-counted in GA/Clarity.
    -->
    <script>
      function brumixLoadAnalytics() {
        var gtagScript = document.createElement("script");
        gtagScript.async = true;
        gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-EHYLCHFFC9";
        document.head.appendChild(gtagScript);
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", "G-EHYLCHFFC9");

        (function (c, l, a, r, i, t, y) {
          c[a] =
            c[a] ||
            function () {
              (c[a].q = c[a].q || []).push(arguments);
            };
          t = l.createElement(r);
          t.async = 1;
          t.src = "https://www.clarity.ms/tag/" + i + "?ref=bwt";
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "y9gkcsac8j");
      }
      (function () {
        var loaded = false;
        var events = ["pointerdown", "touchstart", "keydown", "scroll"];
        var timeoutId;
        function trigger() {
          if (loaded) return;
          loaded = true;
          clearTimeout(timeoutId);
          events.forEach(function (evt) {
            window.removeEventListener(evt, trigger, { passive: true });
          });
          brumixLoadAnalytics();
        }
        events.forEach(function (evt) {
          window.addEventListener(evt, trigger, { passive: true, once: true });
        });
        timeoutId = setTimeout(trigger, 8000);
      })();
    </script>
